# Add with: docker compose -f docker-compose.yml -f deploy/compose.calls.yml --profile calls up -d
services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    profiles: [calls]
    command: --config /etc/livekit.yaml
    # The config comes from the `livekit` entry at the bottom of this file, not from
    # a file on disk. livekit-server does NOT expand ${VAR} inside its own config —
    # it only does that for `key_file` — so the secrets have to be substituted before
    # the container sees them, and compose is what substitutes them.
    configs:
      - source: livekit
        target: /etc/livekit.yaml
    ports:
      # Signal (ws), ICE-TCP, and the single-port UDP mux (D9) — not a port range.
      # Past ~100 concurrent participants on one node, see docs/deploy.md for
      # switching this service to network_mode: host with a UDP range instead.
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    depends_on:
      - redis

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    profiles: [calls]
    # No published port: only `livekit` talks to it, over the compose network.
    volumes:
      - livekit-redis-data:/data

  eturnal:
    image: eturnal/eturnal:1.12.2-alpine
    restart: unless-stopped
    profiles: [calls]
    environment:
      ETURNAL_SECRET: ${TAUT_TURN_SECRET:?set TAUT_TURN_SECRET (openssl rand -hex 32)}
      ETURNAL_RELAY_IPV4_ADDR: ${TAUT_TURN_PUBLIC_IP:?set TAUT_TURN_PUBLIC_IP, this host's public IPv4}
      ETURNAL_RELAY_MIN_PORT: 49160
      ETURNAL_RELAY_MAX_PORT: 49200
    volumes:
      - ./deploy/eturnal.yml:/etc/eturnal.yml:ro
    # The image runs as uid 9000, not root. deploy/eturnal.yml must be readable by
    # it before you bring this up:
    #   chown 9000:9000 deploy/eturnal.yml && chmod 640 deploy/eturnal.yml
    # Skip that and eturnal dies on boot with a permission error, not a helpful one.
    ports:
      - '3478:3478/udp'
      - '3478:3478'
      - '49160-49200:49160-49200/udp'

configs:
  livekit:
    content: |
      port: 7880

      rtc:
        tcp_port: 7881
        # Single-port UDP mux, not a port range (docs/build-plan-calls.md D9). A
        # published 50000-60000 range spawns one docker-proxy per port and falls over
        # on Docker Desktop; past ~100 concurrent participants on one node, switch
        # this service to network_mode: host with a real range (docs/deploy.md).
        udp_port: 7882
        use_external_ip: true

        # eturnal is the only TURN server on this host (D10). The secret is shared
        # with it: LiveKit mints ephemeral TURN REST credentials that eturnal then
        # validates. Two entries because one entry carries one protocol.
        turn_servers:
          - host: ${TAUT_TURN_HOST:?set TAUT_TURN_HOST, the host clients reach eturnal on}
            port: 3478
            protocol: udp
            secret: ${TAUT_TURN_SECRET:?set TAUT_TURN_SECRET (openssl rand -hex 32)}
          - host: ${TAUT_TURN_HOST}
            port: 3478
            protocol: tcp
            secret: ${TAUT_TURN_SECRET}

      redis:
        address: redis:6379

      keys:
        ${TAUT_LIVEKIT_API_KEY:?set TAUT_LIVEKIT_API_KEY (openssl rand -hex 16)}: ${TAUT_LIVEKIT_API_SECRET:?set TAUT_LIVEKIT_API_SECRET (openssl rand -hex 32)}

      # Who is in a room is decided here, not in the browser (D2). Taut verifies the
      # JWT LiveKit signs each of these with.
      webhook:
        api_key: ${TAUT_LIVEKIT_API_KEY}
        urls:
          - http://taut:3000/api/hooks/livekit

      # LiveKit ships its own TURN server. It stays off: eturnal owns 3478, and two
      # TURN servers on one host is the failure mode to avoid (D10).
      turn:
        enabled: false

volumes:
  livekit-redis-data:
