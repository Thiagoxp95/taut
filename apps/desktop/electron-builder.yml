appId: dev.taut.desktop
productName: Taut
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/.env*'
asarUnpack:
  - resources/**
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Taut uses your camera during calls.
    NSMicrophoneUsageDescription: Taut uses your microphone during calls.
  artifactName: Taut-${version}-mac-${arch}.${ext}
dmg:
  artifactName: Taut-${version}-mac-${arch}.${ext}
npmRebuild: false
protocols:
  - name: Taut
    schemes:
      - taut
